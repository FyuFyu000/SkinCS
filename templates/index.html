<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CS2 Skin Market</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <!-- ============ HEADER ============ -->
  <header class="topbar">
    <div class="brand">
      <span class="logo">▶</span>
      <span class="brand-text">CS2 SKIN MARKET</span>
    </div>
    <div class="topbar-right">Information Management Project</div>
  </header>

  <!-- ============ SEARCH / FILTER BAR ============ -->
  <section class="search-section">
    <div class="search-wrapper">
      <input type="text" id="searchInput"
             placeholder="Search the Market for skins…  (e.g. AK-47, Asiimov, AWP)" />
      <select id="rarityFilter">
        <option value="All">All Rarities</option>
      </select>
      <select id="sortSelect">
        <option value="name">Sort: Name (A-Z)</option>
        <option value="price_asc">Price: Low → High</option>
        <option value="price_desc">Price: High → Low</option>
      </select>
      <button id="searchBtn">Search</button>
    </div>
    <p class="result-info" id="resultInfo">Loading…</p>
  </section>

  <!-- ============ RESULTS ============ -->
  <main>
    <table class="market-table" id="resultsTable">
      <thead>
        <tr>
          <th class="col-img">Image</th>
          <th class="col-name">Name</th>
          <th class="col-wear">Wear</th>
          <th class="col-rarity">Rarity</th>
          <th class="col-price">Market Value</th>
        </tr>
      </thead>
      <tbody id="resultsBody"></tbody>
    </table>
  </main>

  <footer>
    <p>CS2 Skin Market • Built with Flask + SQLite • Information Management 2026</p>
  </footer>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
